display_information:
  name: Telescope
  description: A friendly consent based research collection tool!
  long_description: When a research tags and requests one of your messages, you will receive a notification from this bot with the option to opt in or opt out of data collection. If you choose to opt in, you will be notified when future messages are collected and given the option to individually anonymize or retract them.
features:
  bot_user:
    display_name: Telescope
    always_online: false
  slash_commands:
    - command: /set-broadcast-channel
      description: Assigns current channel to broadcast
      should_escape: false
    - command: /set-observatory-channel
      description: Assigns current channel to observatory
      should_escape: false
    - command: /ping
      description: Telescope will respond if online
      should_escape: false
    - command: /add-to-public-channels
      description: Adds Telescope to all public channels
      should_escape: false
    - command: /backfill-messages
      description: Backfills past Telescope messages in channels the bot is in
      should_escape: false
    - command: /add-to-channel
      description: Adds Telescope to specified channel, or current one if unspecified
      usage_hint: "[channel]"
      should_escape: true
    - command: /remove-from-channel
      description: Adds Telescope to specified channel, or current one if unspecified
      usage_hint: "[channel]"
      should_escape: true
    - command: /list-channels
      description: Returns a list of channels Telescope is in
      should_escape: false
    - command: /activate
      description: Activates Telescope, enabling emoji tagging and backfill
      should_escape: false
oauth_config:
  scopes:
    user:
      - groups:write.invites
      - search:read
    bot:
      - channels:manage
      - channels:history
      - channels:join
      - channels:read
      - chat:write
      - commands
      - files:write
      - groups:history
      - groups:read
      - groups:write
      - im:history
      - im:read
      - reactions:read
      - reactions:write
      - team:read
      - users.profile:read
      - users:read
  pkce_enabled: false
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  is_mcp_enabled: false
